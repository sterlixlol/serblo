# Probe on a Vertex H100 (a3-highgpu-1g): 8 steps at the real mb/accum to confirm the job
# provisions + measure warm UNCOMPILED tok/s (conservative) for the exact cost math.
# No eval, no checkpoint, no gcs (isolated from the real run).
out_dir: /workspace/ckpts
data_dir: /workspace/tokenized
device: cuda
seed: 0
bf16: true
model:
  vocab_size: 32000
  n_layer: 14
  n_head: 12
  n_kv_head: 4
  d_model: 768
  mlp_hidden: 2432
  ctx: 2048
  tie_embeddings: true
weight_decay: 0.1
peak_lr: 4.0e-4
betas: [0.9, 0.95]
grad_clip: 1.0
lr_floor_frac: 0.1
micro_batch: 32
grad_accum: 8
warmup_steps: 8
max_steps: 8
log_interval: 2
eval_interval: 999999
eval_iters: 5
ckpt_interval: 999999
patience: 0
